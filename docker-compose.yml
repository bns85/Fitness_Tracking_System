version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: benchmark-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./benchmark/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "event-app:host-gateway"
      - "polling-app:host-gateway"
      - "loadgen-event:host-gateway"
      - "loadgen-polling:host-gateway"
      - "cadvisor:host-gateway"
    networks:
      - benchmark-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: benchmark-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/event-vs-polling.json
    volumes:
      - ./benchmark/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./benchmark/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - benchmark-net

networks:
  benchmark-net:
    driver: bridge
