global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "event-app"
    static_configs:
      - targets: ["event-app:5001"]
        labels:
          variant: "event"

  - job_name: "polling-app"
    static_configs:
      - targets: ["polling-app:5002"]
        labels:
          variant: "polling"

  - job_name: "loadgen"
    static_configs:
      - targets: ["loadgen-event:9100", "loadgen-polling:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
