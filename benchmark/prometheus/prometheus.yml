global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "event-app"
    static_configs:
      - targets: ["event-app:5001"]
        labels:
          variant: "event"

  - job_name: "polling-app"
    static_configs:
      - targets: ["polling-app:5002"]
        labels:
          variant: "polling"

  # ONE job for the load generator. It runs on the laptop (host), not in Docker.
  # Its metrics already carry a `variant` label, so no target label is added here.
  - job_name: "loadgen"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # CSV results exporter: publishes the numbers from benchmark/results/*-levels.csv
  # so Grafana can show exactly the same values as the CSV files and the report.
  - job_name: "csv-results"
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          variant: "cadvisor"
